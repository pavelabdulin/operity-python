[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operity-client"
version = "0.1.0"
description = "Operity client: signed requests for agents, API-key calls for principals"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://operity.co"
Source = "https://github.com/pavelabdulin/operity-python"
"Wire format" = "https://github.com/pavelabdulin/operity-python/blob/main/docs/WIRE-FORMAT.md"

[tool.setuptools.packages.find]
include = ["operity_client*"]
